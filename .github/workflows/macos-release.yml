name: Build and release desktop installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the current app version as a signed GitHub release (main only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Verify Apple Silicon development build
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Read app version and check tag
        id: version
        shell: bash
        run: |
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a numeric app version, got $version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match app version v$version"
            exit 1
          fi
          if [[ "$(node -p 'require("./package.json").version')" != "$version" ]]; then
            echo "::error::package.json version must match app version $version"
            exit 1
          fi
          cargo_version=$(cargo metadata --no-deps --format-version 1 --locked --manifest-path src-tauri/Cargo.toml |
            node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).packages.find(p => p.name === "local-page-studio").version')
          if [[ "$cargo_version" != "$version" ]]; then
            echo "::error::Cargo.toml version must match app version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies and test
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm test

      - name: Run Rust tests
        run: |
          test "$(uname -m)" = arm64
          rustup show active-toolchain
          cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build the desktop installer
        run: >-
          pnpm exec tauri build --bundles app,dmg
          --config '{"bundle":{"macOS":{"minimumSystemVersion":"13.3"}}}'
          -- --locked

      - name: Verify the development DMG
        shell: bash
        run: |
          dmg=(src-tauri/target/release/bundle/dmg/*_aarch64.dmg)
          test "${#dmg[@]}" -eq 1
          test -f "${dmg[0]}"
          mount=$(mktemp -d "$RUNNER_TEMP/rwkv-dmg.XXXXXX")
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "${dmg[0]}"
          trap 'hdiutil detach "$mount"' EXIT
          app=("$mount"/*.app)
          test "${#app[@]}" -eq 1
          test -d "${app[0]}"
          test -x "${app[0]}/Contents/MacOS/local-page-studio"
          codesign --verify --deep --strict "${app[0]}"
          test -z "$(find "${app[0]}" \( -iname '*.gguf' -o -iname '*.pth' -o -iname '*.rwkvq' -o -iname 'llama-server*' -o -iname 'rwkv_lighting_cuda*' \) -print -quit)"

  windows:
    name: Test and package Windows x64 installer
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install frontend dependencies and test
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm test

      - name: Run Rust tests
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml

      - name: Build Windows NSIS installer
        shell: cmd
        run: pnpm exec tauri build --bundles nsis -- --locked

      - name: Install and launch the desktop client
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installer = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected one Windows installer' }
          $installDir = Join-Path $env:RUNNER_TEMP 'RWKV-Vibe-Code 安装测试'
          $setup = Start-Process -FilePath $installer[0].FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "NSIS exited with $($setup.ExitCode)" }
          $inferenceFiles = Get-ChildItem $installDir -File -Recurse | Where-Object Name -Match '\.(gguf|pth|rwkvq)$|^(llama-server|rwkv_lighting_cuda)'
          if ($inferenceFiles) { throw 'Installer contains inference server files or model weights' }
          $desktop = @(Get-ChildItem $installDir -File -Filter '*.exe' | Where-Object Name -NotMatch 'uninstall')
          if ($desktop.Count -ne 1) { throw 'Expected one installed desktop executable' }
          $app = Start-Process -FilePath $desktop[0].FullName -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 45; $i++) {
              $app.Refresh()
              if ($app.HasExited) { throw "Desktop app exited with $($app.ExitCode)" }
              if ($app.MainWindowHandle -ne [IntPtr]::Zero -and $app.MainWindowTitle -eq 'RWKV-Vibe-Code') {
                $ready = $true
                break
              }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'The installed desktop client did not open its main window' }
            Write-Host 'Installed desktop client opened its main window.'
          } finally {
            $app.Refresh()
            if (-not $app.HasExited) {
              if ($app.CloseMainWindow()) { $null = $app.WaitForExit(10000) }
              if (-not $app.HasExited) { Stop-Process -Id $app.Id -ErrorAction SilentlyContinue }
            }
          }
          $null = New-Item -ItemType Directory -Path release
          $file = "RWKV-Vibe-Code_${version}_x64-setup.exe"
          Copy-Item $installer[0].FullName "release/$file"
          $digest = (Get-FileHash "release/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
          ("$digest  $file" + [char]10) | Set-Content "release/$file.sha256" -Encoding ascii -NoNewline
          (Get-FileHash $desktop[0].FullName -Algorithm SHA256).Hash |
            Set-Content release/desktop-executable.sha256 -Encoding ascii -NoNewline

      - name: Upload Windows installer and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: release/
          if-no-files-found: error
          retention-days: 14

      - name: Build the previous-version NSIS upgrade fixture
        if: >-
          (github.event_name == 'push' && github.ref_type == 'tag') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release)
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'rwkv-upgrade-source'
          node .github/workflows/support/prepare-upgrade-fixture.mjs $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Failed to prepare upgrade fixture' }
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target'
          Push-Location $fixture
          try {
            pnpm install --frozen-lockfile
            if ($LASTEXITCODE -ne 0) { throw 'Fixture dependency installation failed' }
            pnpm exec tauri build --config upgrade-version.json --bundles nsis -- --locked
            if ($LASTEXITCODE -ne 0) { throw 'Fixture build failed' }
          } finally { Pop-Location }
          $installer = @(Get-ChildItem "$env:CARGO_TARGET_DIR/release/bundle/nsis" -Filter '*_0.2.5_*-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected one previous-version fixture installer' }
          $null = New-Item -ItemType Directory -Path upgrade-fixture
          Copy-Item $installer[0].FullName 'upgrade-fixture/fixture.exe'

      - name: Upload Windows upgrade fixture
        if: >-
          (github.event_name == 'push' && github.ref_type == 'tag') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-upgrade-fixture
          path: upgrade-fixture/
          if-no-files-found: error
          retention-days: 2

  linux:
    name: Test and package Linux x64 DEB and AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential file libwebkit2gtk-4.1-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 xauth xvfb xdotool

      - name: Install frontend dependencies and test
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm test

      - name: Run Rust tests
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml

      - name: Build Linux installers
        env:
          NO_STRIP: '1'
        run: pnpm exec tauri build -- --locked

      - name: Verify Linux packages and generate checksums
        shell: bash
        run: |
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          deb=(src-tauri/target/release/bundle/deb/*_amd64.deb)
          appimage=(src-tauri/target/release/bundle/appimage/*_amd64.AppImage)
          test "${#deb[@]}" -eq 1
          test -f "${deb[0]}"
          test "${#appimage[@]}" -eq 1
          test -x "${appimage[0]}"
          test "$(dpkg-deb -f "${deb[0]}" Architecture)" = amd64
          smoke=$(mktemp -d "$RUNNER_TEMP/rwkv-linux.XXXXXX")
          trap 'rm -rf "$smoke"' EXIT
          dpkg-deb -x "${deb[0]}" "$smoke/deb"
          image=$(realpath "${appimage[0]}")
          (cd "$smoke" && "$image" --appimage-extract > /dev/null)

          verify_client() {
            test -x "$1/usr/bin/local-page-studio"
            test -z "$(find "$1" \( -iname '*.gguf' -o -iname '*.pth' -o -iname '*.rwkvq' -o -iname 'llama-server*' -o -iname 'rwkv_lighting_cuda*' \) -print -quit)"
          }

          verify_client "$smoke/deb"
          verify_client "$smoke/squashfs-root"

          for desktop in "$smoke/deb/usr/bin/local-page-studio" "$smoke/squashfs-root/AppRun"; do
            WEBKIT_DISABLE_DMABUF_RENDERER=1 xvfb-run -a bash -e -c '
              "$1" &
              app=$!
              trap "kill $app 2>/dev/null || true" EXIT
              timeout 30s xdotool search --sync --onlyvisible --name "^RWKV-Vibe-Code$"
              kill -0 "$app"
            ' bash "$desktop"
          done

          mkdir -p release
          deb_file="RWKV-Vibe-Code_${version}_amd64.deb"
          image_file="RWKV-Vibe-Code_${version}_amd64.AppImage"
          cp "${deb[0]}" "release/$deb_file"
          cp "${appimage[0]}" "release/$image_file"
          cd release
          sha256sum "$deb_file" > "$deb_file.sha256"
          sha256sum "$image_file" > "$image_file.sha256"

      - name: Upload Linux installers and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x64
          path: release/
          if-no-files-found: error
          retention-days: 14

      - name: Build previous-version DEB and AppImage upgrade fixtures
        if: >-
          (github.event_name == 'push' && github.ref_type == 'tag') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release)
        env:
          NO_STRIP: '1'
        shell: bash
        run: |
          fixture="$RUNNER_TEMP/rwkv-upgrade-source"
          node .github/workflows/support/prepare-upgrade-fixture.mjs "$fixture"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/src-tauri/target"
          (
            cd "$fixture"
            pnpm install --frozen-lockfile
            pnpm exec tauri build --config upgrade-version.json -- --locked
          )
          mkdir upgrade-fixture
          cp "$CARGO_TARGET_DIR"/release/bundle/deb/*_0.2.5_amd64.deb upgrade-fixture/fixture.deb
          cp "$CARGO_TARGET_DIR"/release/bundle/appimage/*_0.2.5_amd64.AppImage upgrade-fixture/fixture.AppImage

      - name: Upload Linux upgrade fixtures
        if: >-
          (github.event_name == 'push' && github.ref_type == 'tag') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-upgrade-fixtures
          path: upgrade-fixture/
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Sign and publish Windows and Linux release
    needs: [build, windows, linux]
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: desktop-release-${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64
          path: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x64
          path: release

      - name: Install signing and verification tools
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - name: Sign verified installers for in-app updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo '::error::The TAURI_SIGNING_PRIVATE_KEY repository secret is required to publish an update.'
            exit 1
          fi
          # Tauri v2 uses the native NSIS and AppImage bytes. Sign all three verified bundles
          # here so the release key is scoped to signing and also covers the Debian installer.
          for file in "RWKV-Vibe-Code_${VERSION}_x64-setup.exe" \
                      "RWKV-Vibe-Code_${VERSION}_amd64.deb" \
                      "RWKV-Vibe-Code_${VERSION}_amd64.AppImage"; do
            (cd release && sha256sum --check --strict "$file.sha256")
            pnpm exec tauri signer sign --app-version "$VERSION" "release/$file"
            test -s "release/$file.sig"
          done

      - name: Verify signatures and build update manifest
        working-directory: release
        env:
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          config=../src-tauri/tauri.conf.json
          origin="https://github.com/$GH_REPO/releases"
          jq -e --arg endpoint "$origin/latest/download/latest.json" \
            '.plugins.updater | .requireSignedVersion == true and .endpoints == [$endpoint]' "$config" > /dev/null
          verification=$(mktemp -d)
          trap 'rm -rf "$verification"' EXIT
          jq -er '.plugins.updater.pubkey' "$config" | base64 --decode > "$verification/public.key"

          nsis="RWKV-Vibe-Code_${VERSION}_x64-setup.exe"
          deb="RWKV-Vibe-Code_${VERSION}_amd64.deb"
          appimage="RWKV-Vibe-Code_${VERSION}_amd64.AppImage"
          for file in "$nsis" "$deb" "$appimage"; do
            base64 --decode "$file.sig" > "$verification/package.minisig"
            minisign -Vq -p "$verification/public.key" -x "$verification/package.minisig" -m "$file"
            awk -F '\t' -v version="version:$VERSION" '
              /^trusted comment: / { for (i = 2; i <= NF; i++) if ($i == version) found = 1 }
              END { exit !found }
            ' "$verification/package.minisig"
          done

          # Key by bundle format to keep Debian and AppImage installations on their own path.
          jq -n --arg version "$VERSION" --arg date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg base "$origin/download/v$VERSION/" --arg nsis "$nsis" --arg deb "$deb" --arg appimage "$appimage" \
            --rawfile nsis_sig "$nsis.sig" --rawfile deb_sig "$deb.sig" --rawfile appimage_sig "$appimage.sig" '
              def artifact($file; $sig): { url: ($base + $file), signature: $sig };
              {
                version: $version,
                pub_date: $date,
                platforms: {
                  "windows-x86_64-nsis": artifact($nsis; $nsis_sig),
                  "linux-x86_64-deb": artifact($deb; $deb_sig),
                  "linux-x86_64-appimage": artifact($appimage; $appimage_sig)
                }
              }
            ' > latest.json

      - name: Publish installers and updater manifest to GitHub Releases
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          tag="v$VERSION"
          files=(
            "RWKV-Vibe-Code_${VERSION}_x64-setup.exe"
            "RWKV-Vibe-Code_${VERSION}_amd64.deb"
            "RWKV-Vibe-Code_${VERSION}_amd64.AppImage"
          )
          assets=(latest.json)
          for file in "${files[@]}"; do
            assets+=("$file" "$file.sha256" "$file.sig")
          done
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            ref_args=(--verify-tag)
          else
            ref_args=(--target "$GITHUB_SHA")
          fi
          gh release create "$tag" "${ref_args[@]}" --latest --title "RWKV-Vibe-Code $tag" \
            --notes 'Windows x64 (NSIS) and Linux x64 (DEB and AppImage) installers support signed in-app updates starting with this version. Install this release once from the assets below to enable updates. Debian updates may ask for administrator approval. Local generation uses Albatross v1.8.15 (CUDA 12.9) and RWKV-7 on a supported NVIDIA GPU. Windows may display an unknown-publisher prompt.' \
            "${assets[@]}"

  upgrade-windows:
    name: Verify the published NSIS update
    needs: [build, publish]
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-upgrade-fixture
          path: upgrade-fixture

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64
          path: release

      - name: Wait for the public updater feed
        run: node .github/workflows/support/wait-for-update-feed.mjs

      - name: Upgrade the installed Windows fixture using the published feed
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'RWKV-Vibe-Code 更新测试'
          $installer = (Resolve-Path 'upgrade-fixture/fixture.exe').Path
          $setup = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Fixture NSIS exited with $($setup.ExitCode)" }
          $desktop = @(Get-ChildItem $installDir -File -Filter '*.exe' | Where-Object Name -NotMatch 'uninstall')
          if ($desktop.Count -ne 1) { throw 'Expected one installed fixture application' }
          $appPath = $desktop[0].FullName
          $appName = [IO.Path]::GetFileNameWithoutExtension($appPath)
          if ($desktop[0].VersionInfo.ProductVersion -ne '0.2.5') { throw 'Fixture must start at version 0.2.5' }
          $expected = (Get-Content release/desktop-executable.sha256 -Raw).Trim()
          if ($expected -notmatch '^[0-9a-fA-F]{64}$' -or (Get-FileHash $appPath -Algorithm SHA256).Hash -eq $expected) {
            throw 'Invalid expected digest or fixture already matches the release'
          }
          $identifier = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).identifier
          $dataDir = Join-Path $env:LOCALAPPDATA $identifier
          $null = New-Item -ItemType Directory -Path $dataDir -Force
          $sentinel = Join-Path $dataDir 'upgrade-smoke.txt'
          Set-Content $sentinel 'preserve-data' -NoNewline
          $app = Start-Process -FilePath $appPath -PassThru
          $replacement = $null
          try {
            for ($i = 0; $i -lt 120; $i++) {
              $installed = Get-Item $appPath -ErrorAction SilentlyContinue
              if ($installed -and $installed.VersionInfo.ProductVersion -eq $env:VERSION) {
                $installedDigest = (Get-FileHash $appPath -Algorithm SHA256 -ErrorAction SilentlyContinue).Hash
                if ($installedDigest -eq $expected) {
                  $replacement = Get-Process -Name $appName -ErrorAction SilentlyContinue |
                    Where-Object { $_.Id -ne $app.Id -and $_.Path -eq $appPath -and $_.MainWindowHandle -ne [IntPtr]::Zero } |
                    Select-Object -First 1
                  if ($replacement) {
                    if ((Get-Content $sentinel -Raw) -ne 'preserve-data') { throw 'Update did not preserve app data' }
                    Write-Host "NSIS installed and restarted the exact $env:VERSION release executable and preserved app data."
                    return
                  }
                }
              }
              Start-Sleep -Seconds 2
            }
            throw "NSIS fixture did not install version $env:VERSION"
          } finally {
            $app.Refresh()
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -ErrorAction SilentlyContinue }
            if ($replacement) { Stop-Process -Id $replacement.Id -ErrorAction SilentlyContinue }
          }

  upgrade-linux:
    name: Verify the published Linux ${{ matrix.format }} update
    needs: [build, publish]
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        format: [deb, appimage]
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-upgrade-fixtures
          path: upgrade-fixture

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x64
          path: release

      - name: Install desktop runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libgtk-3-0 libfuse2 xauth xvfb

      - name: Wait for the public updater feed
        run: node .github/workflows/support/wait-for-update-feed.mjs

      - name: Upgrade the installed Linux fixture using the published feed
        env:
          FORMAT: ${{ matrix.format }}
        run: xvfb-run -a bash .github/workflows/support/smoke-linux-upgrade.sh "$FORMAT"
