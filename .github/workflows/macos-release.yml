name: Build and release desktop installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the current app version as a GitHub prerelease (main only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Test and package Apple Silicon DMG
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Read app version and check tag
        id: version
        shell: bash
        run: |
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a numeric app version, got $version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match app version v$version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies and test
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm test

      - name: Prepare pinned llama.cpp runtime
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          archive="$RUNNER_TEMP/llama-b12110-bin-macos-arm64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" https://github.com/ggml-org/llama.cpp/releases/download/b12110/llama-b12110-bin-macos-arm64.tar.gz
          printf '%s  %s\n' 4f5b8de12e0b9516658ca6a5764c6ffb3d7c659c3dd538556b1413c7b4050662 "$archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          src="$RUNNER_TEMP/llama-b12110"
          runtime="$PWD/src-tauri/resources/runtime"
          mkdir -p "$runtime"
          cp -L "$src/llama-server" "$src/libllama-server-impl.dylib" "$src"/libggml*.0.dylib "$src"/lib{llama,llama-common,mtmd}.0.dylib "$src/LICENSE" "$runtime/"
          "$runtime/llama-server" --version 2>&1 | grep -F cd959bae9

      - name: Run Rust tests
        run: |
          rustup show active-toolchain
          cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build the desktop installer
        run: >-
          pnpm exec tauri build --bundles app,dmg
          --config '{"bundle":{"macOS":{"minimumSystemVersion":"13.3"}}}'
          -- --locked

      - name: Verify the DMG and generate checksum
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dmg=(src-tauri/target/release/bundle/dmg/*_aarch64.dmg)
          test "${#dmg[@]}" -eq 1
          test -f "${dmg[0]}"
          mount=$(mktemp -d "$RUNNER_TEMP/rwkv-dmg.XXXXXX")
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "${dmg[0]}"
          trap 'hdiutil detach "$mount"' EXIT
          app=("$mount"/*.app)
          test "${#app[@]}" -eq 1
          test -d "${app[0]}"
          codesign --verify --deep --strict "${app[0]}"
          test -z "$(find "${app[0]}" -iname '*.gguf' -print -quit)"
          "${app[0]}/Contents/Resources/runtime/llama-server" --version 2>&1 | grep -F cd959bae9
          mkdir -p release
          file="RWKV-Vibe-Code_${VERSION}_aarch64.dmg"
          cp "${dmg[0]}" "release/$file"
          cd release
          shasum -a 256 "$file" > "$file.sha256"

      - name: Upload installer and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm64
          path: release/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Test and package Windows x64 installer
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install frontend dependencies and test
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm test

      - name: Prepare pinned llama.cpp CPU runtime
        run: python scripts/prepare-runtime.py

      - name: Run Rust tests
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml

      - name: Build Windows NSIS installer
        shell: cmd
        run: pnpm exec tauri build --bundles nsis -- --locked

      - name: Install the package and verify its runtime
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installer = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected one Windows installer' }
          $installDir = Join-Path $env:RUNNER_TEMP 'RWKV-Vibe-Code 安装测试'
          $setup = Start-Process -FilePath $installer[0].FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "NSIS exited with $($setup.ExitCode)" }
          $runtimeDir = Join-Path $installDir 'runtime'
          if (Get-ChildItem $installDir -Filter '*.gguf' -Recurse) { throw 'Installer contains model weights' }
          $runtimeVersion = & (Join-Path $runtimeDir 'llama-server.exe') --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $runtimeVersion -notmatch 'cd959bae9') { throw "Runtime check failed: $runtimeVersion" }
          Write-Host $runtimeVersion
          "RWKV_SMOKE_INSTALL_DIR=$installDir" >> $env:GITHUB_ENV
          $null = New-Item -ItemType Directory -Path release
          $file = "RWKV-Vibe-Code_${version}_x64-setup.exe"
          Copy-Item $installer[0].FullName "release/$file"
          $digest = (Get-FileHash "release/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
          ("$digest  $file" + [char]10) | Set-Content "release/$file.sha256" -Encoding ascii -NoNewline

      - name: Install the exact RWKV model with the production downloader
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: |
          $env:RWKV_SMOKE_MODEL_DIR = Join-Path $env:APPDATA 'studio.moment.localpage/models'
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml prepare_production_model_for_smoke_test -- --ignored --nocapture

      - name: Launch installed desktop app and verify model startup
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: |
          $desktop = @(Get-ChildItem $env:RWKV_SMOKE_INSTALL_DIR -File -Filter '*.exe' | Where-Object Name -NotMatch 'uninstall')
          if ($desktop.Count -ne 1) { throw 'Expected one installed desktop executable' }
          $app = Start-Process -FilePath $desktop[0].FullName -PassThru
          $engine = $null
          try {
            $ready = $false
            for ($i = 0; $i -lt 90; $i++) {
              $app.Refresh()
              if ($app.HasExited) { throw "Desktop app exited with $($app.ExitCode)" }
              $engine = Get-CimInstance Win32_Process -Filter "ParentProcessId=$($app.Id) AND Name='llama-server.exe'"
              if ($engine -and $engine.CommandLine -match '--port\s+(\d+)') {
                $port = $Matches[1]
                try {
                  $health = Invoke-RestMethod "http://127.0.0.1:$port/health" -TimeoutSec 2
                  if ($health.status -eq 'ok') { $ready = $true; break }
                } catch {
                  # The server returns 503 until the model is loaded.
                }
              }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'The installed desktop app did not load the model' }
            Write-Host 'Installed desktop app loaded the RWKV model.'
          } finally {
            $app.Refresh()
            if (-not $app.HasExited) {
              if ($app.CloseMainWindow()) { $null = $app.WaitForExit(10000) }
              if (-not $app.HasExited) { Stop-Process -Id $app.Id -ErrorAction SilentlyContinue }
            }
            if ($engine) { Stop-Process -Id $engine.ProcessId -ErrorAction SilentlyContinue }
          }

      - name: Verify four concurrent CPU streams from the installed runtime
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: |
          $name = (Get-Content src-tauri/model-manifest.json -Raw -Encoding utf8 | ConvertFrom-Json).filename
          $model = Join-Path $env:APPDATA "studio.moment.localpage/models/$name"
          $unicodeDir = Join-Path (Split-Path $model) '模型测试'
          $null = New-Item -ItemType Directory -Path $unicodeDir
          $env:RWKV_MODEL_PATH = Join-Path $unicodeDir $name
          $null = New-Item -ItemType HardLink -Path $env:RWKV_MODEL_PATH -Target $model
          python scripts/test-live-metrics.py --runtime-dir (Join-Path $env:RWKV_SMOKE_INSTALL_DIR 'runtime') --concurrency 4 --max-tokens 128 --transport-only

      - name: Upload Windows installer and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish desktop prerelease
    needs: [build, windows]
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: desktop-release-${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-arm64
          path: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64
          path: release

      - name: Publish verified files to GitHub Releases
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          tag="v$VERSION"
          file="RWKV-Vibe-Code_${VERSION}_aarch64.dmg"
          windows_file="RWKV-Vibe-Code_${VERSION}_x64-setup.exe"
          sha256sum --check "$file.sha256" "$windows_file.sha256"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            ref_args=(--verify-tag)
          else
            ref_args=(--target "$GITHUB_SHA")
          fi
          gh release create "$tag" "${ref_args[@]}" --prerelease --title "RWKV-Vibe-Code $tag" --notes 'Default concurrency is 4. Manual and automatic settings use even tiers from 2 to 16. Apple Silicon (macOS 13.3+) and Windows x64 (CPU). macOS is ad-hoc signed and Windows is unsigned. The local model is installed on first launch.' "$file" "$file.sha256" "$windows_file" "$windows_file.sha256"
